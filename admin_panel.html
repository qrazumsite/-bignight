<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGNIGHT — панель сотрудников</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0f; color:#fff; font-family:'Segoe UI',Arial,sans-serif; min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:20px 16px 60px; }

  /* LOGIN */
  #login { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:90vh; text-align:center; }
  #login h1 { font-size:34px; text-transform:uppercase; letter-spacing:2px; }
  #login h1 b { color:#ff2d55; }
  #login p { color:#8f8fa0; font-size:13px; margin:10px 0 26px; }
  #code { width:240px; padding:14px; background:#15151d; border:1px solid #2a2a36; border-radius:10px; color:#fff; font-size:20px; text-align:center; letter-spacing:4px; outline:none; }
  #code:focus { border-color:#ff2d55; }
  .lerr { color:#ff2d55; font-size:13px; margin-top:12px; min-height:18px; }

  /* PANEL */
  #panel { display:none; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid #1d1d27; margin-bottom:18px; }
  header .logo { font-weight:800; letter-spacing:2px; text-transform:uppercase; }
  header .logo b { color:#ff2d55; }
  .out { background:none; border:1px solid #2a2a36; color:#8f8fa0; padding:8px 14px; border-radius:20px; font-size:12px; cursor:pointer; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .stat { background:#15151d; border:1px solid #23232e; border-radius:12px; padding:14px; text-align:center; }
  .stat .v { font-size:26px; font-weight:800; }
  .stat .k { font-size:10px; color:#8f8fa0; letter-spacing:1px; text-transform:uppercase; margin-top:4px; }
  .stat.ok .v { color:#38e07b; }

  .tools { display:flex; gap:10px; margin-bottom:16px; }
  #search { flex:1; padding:12px; background:#15151d; border:1px solid #2a2a36; border-radius:10px; color:#fff; outline:none; }
  #scanbtn { padding:12px 18px; background:#ff2d55; border:none; border-radius:10px; color:#fff; font-weight:700; cursor:pointer; }

  #video-box { display:none; margin-bottom:16px; background:#000; border-radius:14px; overflow:hidden; position:relative; }
  #video-box video { width:100%; display:block; }
  #scan-cancel { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.6); border:1px solid #444; color:#fff; padding:6px 12px; border-radius:16px; cursor:pointer; }

  .glist { display:flex; flex-direction:column; gap:8px; }
  .guest { display:flex; align-items:center; gap:12px; background:#15151d; border:1px solid #23232e; border-radius:12px; padding:12px 14px; }
  .guest.entered { border-color:#38e07b; opacity:.55; }
  .guest .num { font-weight:800; color:#ff2d55; min-width:44px; }
  .guest .who { flex:1; }
  .guest .who .n { font-weight:600; font-size:15px; }
  .guest .who .d { color:#8f8fa0; font-size:12px; margin-top:2px; }
  .go { background:#38e07b; color:#06280f; border:none; padding:9px 14px; border-radius:8px; font-weight:700; cursor:pointer; font-size:12px; }
  .done { color:#38e07b; font-size:18px; font-weight:800; }
  .empty { text-align:center; color:#55555f; padding:40px 0; font-size:14px; }
  .live { display:inline-block; width:8px; height:8px; background:#38e07b; border-radius:50%; margin-right:6px; animation:blink 1.4s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .scan-msg { text-align:center; font-size:14px; margin-bottom:14px; min-height:20px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h1>Big<b>Night</b></h1>
    <p>Панель сотрудников. Введите код доступа.</p>
    <input id="code" type="password" placeholder="••••-••••" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="btn" style="margin-top:16px;background:#ff2d55;color:#fff;border:none;padding:14px 34px;border-radius:30px;font-weight:700;cursor:pointer;" onclick="tryLogin()">Войти</button>
    <div class="lerr" id="lerr"></div>
  </div>

  <div id="panel">
    <header>
      <div class="logo">Big<b>Night</b> • панель</div>
      <button class="out" onclick="logout()">Выход</button>
    </header>

    <div class="stats">
      <div class="stat"><div class="v" id="s_reg">0</div><div class="k">Регистраций</div></div>
      <div class="stat ok"><div class="v" id="s_in">0</div><div class="k">Прошло на входе</div></div>
      <div class="stat"><div class="v" id="s_left">0</div><div class="k">Свободно</div></div>
    </div>

    <div class="tools">
      <input id="search" placeholder="Поиск: имя, телефон, № билета..." oninput="render()">
      <button id="scanbtn" onclick="startScan()">📷 Скан</button>
    </div>

    <div id="video-box">
      <video id="video" playsinline muted></video>
      <button id="scan-cancel" onclick="stopScan()">✕</button>
    </div>
    <div class="scan-msg" id="scan-msg"></div>

    <div class="glist" id="glist"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
var FB = 'https://bignight-7b863-default-rtdb.firebaseio.com';
var CODE = 'QNOCH-2674';
var CAP = 150;
var guests = {};
var timer = null;

function tryLogin() {
  var v = document.getElementById('code').value.trim();
  if (v === CODE) {
    localStorage.setItem('bignight_admin', '1');
    openPanel();
  } else {
    document.getElementById('lerr').textContent = 'Неверный код. Попробуй ещё раз.';
  }
}

function logout() {
  localStorage.removeItem('bignight_admin');
  location.reload();
}

function openPanel() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  refresh();
  timer = setInterval(refresh, 4000);
}

// --- данные из базы
function refresh() {
  fetch(FB + '/guests.json')
    .then(function(r){ return r.json(); })
    .then(function(d){ guests = d || {}; render(); })
    .catch(function(){});
}

function render() {
  var q = document.getElementById('search').value.trim().toLowerCase();
  var reg = 0, ent = 0;
  var list = [];
  Object.keys(guests).forEach(function(k){
    var g = guests[k];
    if (!g || !g.num) return;
    reg++;
    if (g.entered) ent++;
    list.push(g);
  });
  list.sort(function(a,b){ return a.num - b.num; });

  document.getElementById('s_reg').textContent = reg;
  document.getElementById('s_in').textContent = ent;
  document.getElementById('s_left').textContent = Math.max(0, CAP - ent);

  var box = document.getElementById('glist');
  var shown = 0;
  var html = '';
  list.forEach(function(g){
    var hay = ((g.fio||'') + ' ' + (g.phone||'') + ' ' + g.num + ' ' + (g.study||'')).toLowerCase();
    if (q && hay.indexOf(q) === -1) return;
    shown++;
    html += '<div class="guest' + (g.entered ? ' entered' : '') + '">'
      + '<div class="num">№' + g.num + '</div>'
      + '<div class="who"><div class="n">' + esc(g.fio) + '</div>'
      + '<div class="d">' + esc(g.study) + ' • ' + esc(g.phone) + '</div></div>'
      + (g.entered ? '<span class="done">✓</span>' : '<button class="go" onclick="admit(\'' + g.phone + '\')">ПУСК ✓</button>')
      + '</div>';
  });
  box.innerHTML = html || '<div class="empty">' + (q ? 'Никого не найдено' : 'Пока никто не зарегистрировался') + '</div>';
}

function esc(s) { return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function admit(phone) {
  var key = null;
  Object.keys(guests).forEach(function(k){ if (guests[k] && guests[k].phone === phone) key = k; });
  if (!key) return;
  fetch(FB + '/guests/' + key + '.json', {
    method: 'PATCH',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ entered: true })
  }).then(refresh);
}

// --- сканер QR
var stream = null, raf = null;
function startScan() {
  var box = document.getElementById('video-box');
  var msg = document.getElementById('scan-msg');
  box.style.display = 'block';
  msg.textContent = 'Наведи камеру на QR билета...';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    msg.textContent = 'Камера недоступна в этом браузере. Ищи гостя вручную по поиску.';
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(s){
      stream = s;
      var v = document.getElementById('video');
      v.srcObject = s;
      v.play();
      tick();
    })
    .catch(function(){
      msg.textContent = 'Нет доступа к камере. Ищи гостя вручную по поиску.';
    });
}

function tick() {
  var v = document.getElementById('video');
  if (v.readyState === v.HAVE_ENOUGH_DATA) {
    var c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    var ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, c.width, c.height);
    var img = ctx.getImageData(0, 0, c.width, c.height);
    var res = window.jsQR ? jsQR(img.data, c.width, c.height) : null;
    if (res && res.data) {
      var parts = res.data.split('|');
      if (parts[0] === 'BIGNIGHT') {
        stopScan();
        var phone = parts[2] || '';
        var found = false;
        Object.keys(guests).forEach(function(k){
          if (guests[k] && guests[k].phone === phone) {
            found = true;
            if (!guests[k].entered) {
              admit(phone);
              document.getElementById('scan-msg').innerHTML = '<span style="color:#38e07b;font-weight:700;">БИЛЕТ ПРОЙДЕН — ' + esc(guests[k].fio) + ' (№' + guests[k].num + ')</span>';
            } else {
              document.getElementById('scan-msg').innerHTML = '<span style="color:#f0ad4e;">Этот билет уже был на входе (№' + guests[k].num + ')</span>';
            }
          }
        });
        if (!found) document.getElementById('scan-msg').innerHTML = '<span style="color:#ff2d55;">Гость с таким билетом не найден в списке</span>';
        return;
      }
    }
  }
  raf = requestAnimationFrame(tick);
}

function stopScan() {
  if (raf) cancelAnimationFrame(raf);
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  document.getElementById('video-box').style.display = 'none';
}

// --- автологин
if (localStorage.getItem('bignight_admin') === '1') openPanel();
</script>
</body>
</html>
